<!DOCTYPE html>
<html>
    <head>
        <title>Bow and Elementals</title>
        <meta charset="UTF-8">
        <style>
            html, body {
                margin: 0;
                height: 100%;
                background: #000;
                overflow: hidden;
            }
            body {
                display: flex;
                align-items: center;
                justify-content: center;
            }
            /* Холст масштабируется под окно с сохранением пропорций */
            #canvas {
                width: min(100vw, calc(100vh * 1900 / 1050));
                height: auto;
            }
        </style>
    </head>
    <body>
        <canvas id="canvas"></canvas>
        <!-- Порядок важен: каждый файл может пользоваться тем, что объявлено в предыдущих -->
        <script src="js/config.js"></script>
        <script src="js/assets.js"></script>
        <script src="js/progress.js"></script>
        <script src="js/state.js"></script>
        <script src="js/debug.js"></script>
        <script src="js/input.js"></script>
        <script src="js/effects.js"></script>
        <script src="js/enemies.js"></script>
        <script src="js/leveling.js"></script>
        <script src="js/combat.js"></script>
        <script src="js/player.js"></script>
        <script src="js/pickups.js"></script>
        <script src="js/ui.js"></script>
        <script src="js/main.js"></script>
    </body>
</html>
